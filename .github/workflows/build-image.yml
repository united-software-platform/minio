name: build-minio-image

# Собирает образ minio из исходников upstream-тега и публикует в ghcr.io.
# Причина: публичные образы MinIO закрыты (Docker Hub удалён 2026-09-11,
# quay — только авторизованный pull), community-релизы заморожены —
# пересборка последнего community-тега воспроизводима из этого workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Тег minio/minio для сборки'
        required: false
        default: 'RELEASE.2025-10-15T17-29-55Z'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Исходники тега minio
        uses: actions/checkout@v4
        with:
          repository: minio/minio
          ref: ${{ inputs.ref || 'RELEASE.2025-10-15T17-29-55Z' }}
          path: minio

      - name: Dockerfile этого форка
        uses: actions/checkout@v4
        with:
          path: build

      - name: Dockerfile в контекст сборки
        run: cp build/Dockerfile.source minio/Dockerfile.source

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: ./minio
          file: ./minio/Dockerfile.source
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/minio:${{ inputs.ref || 'RELEASE.2025-10-15T17-29-55Z' }}
            ghcr.io/${{ github.repository_owner }}/minio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
